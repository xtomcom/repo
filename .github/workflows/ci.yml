name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['versions.json', '**.md']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh packages/*/*.sh
      - name: Retention rules
        run: tests/retention.sh

  matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
        # Latest upstream release of every package, ignoring what is published.
        run: echo "matrix=$(VERSIONS_FILE=/dev/null scripts/check.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.matrix.outputs.matrix }}

  repo:
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install nfpm
        run: npm install -g @goreleaser/nfpm
      - name: Repository end-to-end test
        run: tests/repo.sh
