name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['versions.json', '**.md']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh packages/*/*.sh
      - name: Retention rules
        run: tests/retention.sh

  matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      all: ${{ steps.matrix.outputs.all }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Only the packages touched by this change, or all of them when
        # shared code changed.
        run: scripts/ci-matrix.sh "$BASE" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.matrix != '[]'
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.matrix.outputs.matrix }}

  repo:
    needs: matrix
    if: needs.matrix.outputs.all == 'true'
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install nfpm
        run: npm install -g @goreleaser/nfpm
      - name: Repository end-to-end test
        run: tests/repo.sh
