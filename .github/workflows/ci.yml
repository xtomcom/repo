name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['versions.json', '**.md']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh packages/*/*.sh
      - name: Retention rules
        run: tests/retention.sh

  matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      all: ${{ steps.matrix.outputs.all }}
      repo: ${{ steps.matrix.outputs.repo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Only the packages touched by this change, or all of them when
        # shared code changed.
        run: scripts/ci-matrix.sh "$BASE" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.matrix != '[]'
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.matrix.outputs.matrix }}

  repo:
    needs: matrix
    if: needs.matrix.outputs.repo == 'true'
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install nfpm
        run: npm install -g @goreleaser/nfpm
      - name: Repository end-to-end test
        run: tests/repo.sh

  # Side-by-side installs, switching, removal and upgrades from the distributions'
  # packages. They take ~10 minutes each, so they only run when their packages
  # (or shared code) changed.
  nodejs:
    needs: matrix
    if: needs.matrix.outputs.all == 'true' || contains(needs.matrix.outputs.matrix, '"package":"nodejs')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install nfpm
        run: npm install -g @goreleaser/nfpm
      - name: Node.js end-to-end test
        run: tests/nodejs.sh

  golang:
    needs: matrix
    if: needs.matrix.outputs.all == 'true' || contains(needs.matrix.outputs.matrix, '"package":"golang')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # tests/golang.sh builds the old single golang package from history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install nfpm
        run: npm install -g @goreleaser/nfpm
      - name: Go end-to-end test
        run: tests/golang.sh
