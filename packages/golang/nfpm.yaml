# Metapackage; @LATEST@ is the newest golang-1.NN, see common.sh.
name: golang
arch: ${ARCH}
epoch: 2
version: ${VERSION}
release: ${RELEASE}
section: golang
priority: optional
maintainer: xTom <packages@xtom.com>
vendor: xTom
homepage: https://go.dev/
license: BSD-3-Clause
description: |-
  Go programming language compiler, tools and standard library
  Metapackage that installs the newest Go version from go.dev (golang-@LATEST@)
  and replaces the distribution's golang packages. Other Go versions can be
  installed alongside as golang-1.NN.
overrides:
  deb:
    depends:
      - golang-@LATEST@ (>= 2:${VERSION})
    # Debian's golang-defaults packages. golang-1.NN conflicts with the
    # distribution's golang-go and golang-src (they own /usr/bin/go and
    # /usr/share/go); providing them here, versioned, satisfies packages that
    # depend on e.g. golang-go (>= 2:1.22~).
    provides:
      - go (= 2:${VERSION}-${RELEASE})
      - golang-go (= 2:${VERSION}-${RELEASE})
      - golang-src (= 2:${VERSION}-${RELEASE})
      - golang-doc (= 2:${VERSION}-${RELEASE})
    conflicts: [golang-go, golang-src, golang-doc]
    replaces: [golang-go, golang-src, golang-doc]
  rpm:
    depends:
      - golang-@LATEST@ >= 2:${VERSION}
    # Fedora/RHEL: golang + golang-bin + golang-src (+ race, misc, tests, docs).
    provides:
      - go = 2:${VERSION}-${RELEASE}
      - golang-go = 2:${VERSION}-${RELEASE}
      - golang-bin = 2:${VERSION}-${RELEASE}
      - golang-src = 2:${VERSION}-${RELEASE}
      - golang-race = 2:${VERSION}-${RELEASE}
      - golang-misc = 2:${VERSION}-${RELEASE}
      - golang-tests = 2:${VERSION}-${RELEASE}
      - golang-docs = 2:${VERSION}-${RELEASE}
    replaces:
      - golang-bin < 2:${VERSION}-${RELEASE}
      - golang-src < 2:${VERSION}-${RELEASE}
      - golang-race < 2:${VERSION}-${RELEASE}
      - golang-misc < 2:${VERSION}-${RELEASE}
      - golang-tests < 2:${VERSION}-${RELEASE}
      - golang-docs < 2:${VERSION}-${RELEASE}
contents: []
