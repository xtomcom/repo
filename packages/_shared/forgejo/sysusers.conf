# Upstream (https://forgejo.org/docs/latest/admin/installation/binary/):
#   adduser --system --shell /bin/bash --gecos 'Git Version Control'
#     --group --disabled-password --home /home/git git
# A login shell is needed for Git over the system's OpenSSH. Same user as gitea.
u git - "Git Version Control" /home/git /bin/bash
