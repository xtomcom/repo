name: bun
arch: ${ARCH}
version: ${VERSION}
release: ${RELEASE}
section: javascript
priority: optional
maintainer: xTom <packages@xtom.com>
vendor: xTom
homepage: https://bun.com
# Bun is MIT; it statically links JavaScriptCore/WebKit (LGPL-2) and others,
# see LICENSE.md.
license: MIT AND LGPL-2.0-or-later
description: |-
  Fast all-in-one JavaScript runtime, bundler, test runner and package manager
  Bun runs JavaScript and TypeScript, installs npm packages, bundles and tests
  code, all in one binary. bunx runs package executables, like npx.
depends:
  - ca-certificates
contents:
  - src: ./bun
    dst: /usr/bin/bun
    file_info: {mode: 0755}
  # The official installer creates the same link.
  - src: bun
    dst: /usr/bin/bunx
    type: symlink
  - src: ./bun.bash
    dst: /usr/share/bash-completion/completions/bun
  - src: ./bun.zsh
    dst: /usr/share/zsh/site-functions/_bun
  - src: ./bun.fish
    dst: /usr/share/fish/vendor_completions.d/bun.fish
  - src: ./LICENSE.md
    dst: /usr/share/doc/bun/copyright
    packager: deb
  - src: ./LICENSE.md
    dst: /usr/share/licenses/bun/LICENSE.md
    type: license
    packager: rpm
