name: goreleaser
arch: ${ARCH}
version: ${VERSION}
release: ${RELEASE}
section: devel
priority: optional
maintainer: xTom <packages@xtom.com>
vendor: xTom
homepage: https://goreleaser.com
license: MIT
description: |-
  Release automation tool for Go, Rust, Zig and more
  GoReleaser builds, archives, packages, signs and publishes release artifacts
  from a single configuration file.
# As upstream's own packages: git is required, the toolchains are optional.
depends:
  - git
suggests:
  - golang
contents:
  - src: ./goreleaser
    dst: /usr/bin/goreleaser
    file_info: {mode: 0755}
  - src: ./manpages/goreleaser.1.gz
    dst: /usr/share/man/man1/goreleaser.1.gz
  - src: ./completions/goreleaser.bash
    dst: /usr/share/bash-completion/completions/goreleaser
  - src: ./completions/goreleaser.zsh
    dst: /usr/share/zsh/site-functions/_goreleaser
  - src: ./completions/goreleaser.fish
    dst: /usr/share/fish/vendor_completions.d/goreleaser.fish
  - src: ./README.md
    dst: /usr/share/doc/goreleaser/README.md
  - src: ./LICENSE.md
    dst: /usr/share/doc/goreleaser/copyright
    packager: deb
  - src: ./LICENSE.md
    dst: /usr/share/licenses/goreleaser/LICENSE
    type: license
    packager: rpm
