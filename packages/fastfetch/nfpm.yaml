name: fastfetch
arch: ${ARCH}
version: ${VERSION}
release: ${RELEASE}
section: utils
priority: optional
maintainer: xTom <packages@xtom.com>
vendor: xTom
homepage: https://github.com/fastfetch-cli/fastfetch
license: MIT
description: |-
  Fast system information tool, like neofetch
  Shows information about the operating system, hardware and software in a
  configurable layout, with presets for neofetch, screenfetch and others.
# Laid out as upstream's tarball and Debian's package.
contents:
  - src: ./usr/bin/fastfetch
    dst: /usr/bin/fastfetch
    file_info: {mode: 0755}
  - src: ./usr/bin/flashfetch
    dst: /usr/bin/flashfetch
    file_info: {mode: 0755}
  - src: ./usr/share/fastfetch
    dst: /usr/share/fastfetch
    type: tree
  - src: ./usr/share/man/man1/fastfetch.1.gz
    dst: /usr/share/man/man1/fastfetch.1.gz
  - src: ./usr/share/bash-completion/completions/fastfetch
    dst: /usr/share/bash-completion/completions/fastfetch
  - src: ./usr/share/zsh/site-functions/_fastfetch
    dst: /usr/share/zsh/site-functions/_fastfetch
  - src: ./usr/share/fish/vendor_completions.d/fastfetch.fish
    dst: /usr/share/fish/vendor_completions.d/fastfetch.fish
  - src: ./usr/share/licenses/fastfetch/LICENSE
    dst: /usr/share/doc/fastfetch/copyright
    packager: deb
  - src: ./usr/share/licenses/fastfetch/LICENSE
    dst: /usr/share/licenses/fastfetch/LICENSE
    type: license
    packager: rpm
