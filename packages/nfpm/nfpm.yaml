name: nfpm
arch: ${ARCH}
version: ${VERSION}
release: ${RELEASE}
section: devel
priority: optional
maintainer: xTom <packages@xtom.com>
vendor: xTom
homepage: https://github.com/goreleaser/nfpm
license: MIT
description: |-
  Simple deb, rpm, apk, ipk and arch linux packager
  nFPM builds Linux packages from a YAML file, without Ruby, tar or other tools.
contents:
  - src: ./nfpm
    dst: /usr/bin/nfpm
    file_info: {mode: 0755}
  - src: ./manpages/nfpm.1.gz
    dst: /usr/share/man/man1/nfpm.1.gz
  - src: ./completions/nfpm.bash
    dst: /usr/share/bash-completion/completions/nfpm
  - src: ./completions/nfpm.zsh
    dst: /usr/share/zsh/site-functions/_nfpm
  - src: ./completions/nfpm.fish
    dst: /usr/share/fish/vendor_completions.d/nfpm.fish
  - src: ./README.md
    dst: /usr/share/doc/nfpm/README.md
  - src: ./LICENSE.md
    dst: /usr/share/doc/nfpm/copyright
    packager: deb
  - src: ./LICENSE.md
    dst: /usr/share/licenses/nfpm/LICENSE
    type: license
    packager: rpm
